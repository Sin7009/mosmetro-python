[project]
name = "mosmetro-python"
version = "0.1.0"
description = "Async Python client for Moscow Metro Wi-Fi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "user-agent>=0.1.10",
    "furl>=2.1.3",
    "beautifulsoup4>=4.12.0",
]

[tool.uv]
dev-dependencies = [
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosmetro"]
